[project]
name = "saurabh-portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for Saurabh Patil's portfolio."
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.0,<5.0",
    "email-validator>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.6,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["alembic"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["alembic"]
python_version = "3.13"
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["jose.*", "workers", "workers.*"]
